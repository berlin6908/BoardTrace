name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/boardtrace-web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: training/requirements.in
      - name: Install CPU Python dependencies
        run: |
          python -m pip install torch==2.7.1+cpu torchvision==0.22.1+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU Torch installation failed.' }
          python -m pip install -r training/requirements.in
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed.' }
      - name: Start isolated LocalDB instance
        run: |
          $localdb = Get-ChildItem -Path "$env:ProgramFiles/Microsoft SQL Server/*/Tools/Binn/SqlLocalDB.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $localdb) { throw 'The Windows runner has no LocalDB runtime.' }
          & $localdb.FullName create BoardTrace
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB instance creation failed.' }
          & $localdb.FullName start BoardTrace
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB instance start failed.' }
      - name: Build Web
        run: |
          npm --prefix src/boardtrace-web ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm --prefix src/boardtrace-web run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed.' }
      - name: Restore locked .NET dependencies
        run: dotnet restore BoardTrace.sln --locked-mode --nologo
      - name: Build .NET solution
        run: dotnet build BoardTrace.sln --configuration Release --no-restore --nologo
      - name: Test .NET against SQLite and SQL Server
        run: dotnet test BoardTrace.sln --configuration Release --no-build --logger trx --results-directory artifacts/ci/dotnet --nologo
      - name: Test training, evaluation and simulator
        run: python -m pytest tests/python -q --junitxml=artifacts/ci/python.xml
