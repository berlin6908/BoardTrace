<script>
'use strict';
const data=JSON.parse(document.getElementById('demo-data').textContent);
const chapters=data.chapters, total=data.durationSeconds;
const $=id=>document.getElementById(id);
let elapsed=0, playing=false, anchor=0, active=-1, hasStarted=false;
const format=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function now(){return playing?Math.min(total,elapsed+(performance.now()-anchor)/1000):elapsed;}
function sceneFor(time){let n=0;for(let i=0;i<chapters.length;i++)if(time>=chapters[i].start)n=i;return n;}
function renderScene(index){
 active=index;const c=chapters[index];$('chapter-tag').textContent=`第 ${index+1} / ${chapters.length} 章 · ${format(c.start)}–${format(c.start+c.duration)}`;
 $('chapter-title').textContent=c.title;$('narration').replaceChildren(...c.text.map(t=>{const p=document.createElement('p');p.textContent=t;return p;}));
 $('note').textContent=c.note;$('evidence').textContent='证据来源：'+c.evidence;
 const visual=$('visual');visual.replaceChildren();
 if(c.image){const img=document.createElement('img');img.alt=c.title+'：实际运行原截图';img.src=data.images[c.image];visual.append(img);$('image-source').textContent='运行截图：'+data.assets[c.image]+' · 原始图片字节，未裁剪或编辑';}
 else{visual.innerHTML=c.kind==='metrics'?data.metrics:c.kind==='results'?data.results:data.architecture;$('image-source').textContent=c.kind==='metrics'?'固定 500 个测试视野的框级结果；开发验证视野另计。':c.kind==='results'?'双工位保存结果与中央档案全量核对；中断尾项据实保留。':'按已实现职责绘制的架构示意；这不是实时运行状态图。';}
 $('previous').disabled=index===0;$('next').disabled=index===chapters.length-1;
}
function render(){let time=now();if(playing&&time>=total){elapsed=total;playing=false;time=total;}
 const index=sceneFor(time);if(index!==active)renderScene(index);
 $('clock').textContent=format(time)+' / '+format(total);$('clock').dataset.elapsedSeconds=time.toFixed(3);
 $('seek').value=String(Math.floor(time));$('seek').setAttribute('aria-valuetext',format(time)+'，共'+format(total));
 $('play').textContent=playing?'暂停':time>=total?'重新播放':'播放';
 $('playback-state').textContent=time>=total?'演示结束':playing?'播放中':hasStarted?'已暂停':'未开始';
}
function seek(time){elapsed=Math.max(0,Math.min(total,time));anchor=performance.now();if(elapsed>=total)playing=false;render();}
$('play').addEventListener('click',()=>{if(playing){elapsed=now();playing=false;}else{if(elapsed>=total)elapsed=0;playing=true;hasStarted=true;anchor=performance.now();}render();});
$('previous').addEventListener('click',()=>seek(chapters[Math.max(0,active-1)].start));
$('next').addEventListener('click',()=>seek(chapters[Math.min(chapters.length-1,active+1)].start));
$('seek').addEventListener('input',e=>seek(Number(e.target.value)));
render();setInterval(render,100);
</script></body></html>
